<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление профилем</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- МОДАЛКА АНКЕТЫ РОДИТЕЛЯ (Появляется, если данных нет) -->
    <div id="parentModal" class="parent-modal" style="display: none;">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: #10B981; margin-bottom: 8px;">Добро пожаловать!</h2>
            <p id="modalSub" style="font-size: 13px; color: #a0a0a0; margin-bottom: 20px;">Пожалуйста, укажите информацию о себе для продолжения:</p>
            
            <label id="labelParentRole">Кто вы для ребенка?</label>
            <select id="parentRoleSelect" onchange="checkCustomRole(this.value)">
                <option value="Мать">Мать</option>
                <option value="Отец">Отец</option>
                <option value="Бабушка">Бабушка</option>
                <option value="Дедушка">Дедушка</option>
                <option value="Няня">Няня</option>
                <option value="Другое">Другое</option>
            </select>
            
            <input type="text" id="customParentRole" placeholder="Укажите кто вы..." style="display: none; margin-top: -10px;">

            <label id="labelParentAge" style="margin-top: 15px;">Ваш возраст</label>
            <input type="number" id="parentAgeInput" placeholder="Например: 32" min="12" max="100">

            <button class="primary-btn" id="saveParentBtn" onclick="saveParentInfo()" style="margin-top: 10px;">Сохранить и продолжить</button>
        </div>
    </div>

    <div class="slider-container" id="sliderContainer">
        <div class="slider-track" id="sliderTrack"></div>
    </div>

    <div class="header-container">
        <h1 id="pageTitle">Профили детей</h1>
        <select id="appLangSelector" onchange="changeAppLanguage(this.value)">
            <option value="ru">🇷🇺 RU</option>
            <option value="uz">🇺🇿 UZ</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <div id="childrenList">
        <div class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderText">Загружаем...</div>
        </div>
    </div>

    <div id="formContainer" style="display: none;">
        <h2 id="formTitle">Добавить ребенка</h2>
        
        <label for="language" id="labelLang">Язык сказок</label>
        <select id="language">
            <option value="ru">🇷🇺 Русский</option>
            <option value="uz">🇺🇿 O'zbekcha</option>
            <option value="en">🇬🇧 English</option>
        </select>

        <label for="childName" id="labelName">Имя</label>
        <input type="text" id="childName" placeholder="Например: Тимур" autocomplete="off">

        <label id="labelGender">Пол</label>
        <div class="radio-group">
            <div class="radio-label selected" id="btn-M" onclick="selectGender('M')"><span id="txtBoy">Мальчик 👦</span></div>
            <div class="radio-label" id="btn-F" onclick="selectGender('F')"><span id="txtGirl">Девочка 👧</span></div>
        </div>

        <div id="regConsentContainer" class="legal-check" style="display: none;">
            <input type="checkbox" id="regConsent">
            <label for="regConsent" id="regConsentLabel"></label>
        </div>

        <button class="primary-btn" id="saveBtn" onclick="saveData()">Добавить профиль</button>
        <button class="cancel-edit" id="cancelBtn" onclick="resetForm()">Отменить редактирование</button>
    </div>

    <div id="statusSection" class="status-card">
        <div id="statusBadge" class="status-badge">...</div>
        <div id="statusText" class="status-text"></div>
        
        <div id="paymentConsentContainer" class="legal-check" style="display: none;">
            <input type="checkbox" id="paymentConsent">
            <label for="paymentConsent" id="paymentConsentLabel"></label>
        </div>
        
        <button id="renewBtn" class="primary-btn" style="display: none;" onclick="initiatePayment()"></button>
    </div>

   <!-- Рекламный баннер (надежный фоновый вариант) -->
    <div id="promoBannerContainer" class="promo-banner" style="display: none;"></div>

    <div class="footer-links" id="footerLinks"></div>

    <script src="app.js" defer></script>
</body>
</html>
