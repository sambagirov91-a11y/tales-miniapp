<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление профилем</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; margin: 0; display: flex; flex-direction: column; overflow-x: hidden; }
        h1, h2 { font-weight: 600; margin-top: 0; }
        h1 { font-size: 22px; margin-bottom: 16px; margin-top: 16px; }
        h2 { font-size: 18px; margin-bottom: 16px; color: #10B981; }
        
        .slider-container { width: 100%; height: 160px; border-radius: 12px; overflow: hidden; position: relative; margin-bottom: 16px; background-color: #1e1e1e; display: none; }
        .slider-track { display: flex; height: 100%; transition: transform 0.5s ease-in-out; }
        .slide { min-width: 100%; height: 100%; background-size: cover; background-position: center; display: flex; align-items: flex-end; }
        .slide-title { background: linear-gradient(transparent, rgba(0,0,0,0.9)); color: white; width: 100%; padding: 20px 16px 12px 16px; font-weight: 600; font-size: 15px; }

        .status-card { background-color: #1e1e1e; border: 1px solid #333333; border-radius: 12px; padding: 20px 16px; margin-top: 24px; margin-bottom: 0px; text-align: center; display: none; }
        .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.trial { background: rgba(245, 158, 11, 0.15); color: #F59E0B; }
        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: #10B981; }
        .status-badge.inactive { background: rgba(239, 68, 68, 0.15); color: #EF4444; }
        .status-text { font-size: 14px; color: #a0a0a0; margin-bottom: 20px; line-height: 1.4; }

        .child-card { background-color: #1e1e1e; border: 1px solid #333333; border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .child-info { display: flex; flex-direction: column; gap: 4px; }
        .child-name { font-size: 16px; font-weight: 600; }
        .child-details { font-size: 13px; color: #a0a0a0; }
        .card-actions { display: flex; gap: 8px; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 6px; border-radius: 8px; background-color: #2a2a2a; }
        
        #formContainer { margin-top: 24px; border-top: 1px solid #333; padding-top: 24px; }
        label { display: block; font-size: 14px; color: #a0a0a0; margin-bottom: 8px; }
        input[type="text"], select { background-color: #1e1e1e; color: #ffffff; border: 1px solid #333333; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; margin-bottom: 20px; font-size: 16px; outline: none; }
        input[type="text"]:focus, select:focus { border-color: #10B981; }
        
        .radio-group { display: flex; gap: 12px; margin-bottom: 24px; }
        .radio-label { flex: 1; background-color: #1e1e1e; border: 1px solid #333333; border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; }
        .radio-label.selected { background-color: rgba(16, 185, 129, 0.1); border-color: #10B981; color: #10B981; }
        
        button.primary-btn { background-color: #10B981; color: #ffffff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
        button:disabled { background-color: #333333; color: #888888; }
        .cancel-edit { background: none; border: none; color: #a0a0a0; width: 100%; margin-top: 12px; font-size: 14px; display: none; }
        
        .legal-check { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; text-align: left; }
        .legal-check input[type="checkbox"] { margin-top: 4px; accent-color: #10B981; width: 18px; height: 18px; }
        .legal-check label { font-size: 12px; color: #a0a0a0; line-height: 1.4; margin: 0; }
        .legal-check a { color: #10B981; text-decoration: none; }

        .footer-links { margin-top: 32px; border-top: 1px solid #333; padding-top: 24px; padding-bottom: 40px; text-align: center; display: flex; flex-direction: column; gap: 16px; }
        .footer-links a { color: #888888; text-decoration: none; font-size: 13px; }
        .footer-links a:hover { color: #ffffff; }

        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(16, 185, 129, 0.15); border-top: 4px solid #10B981; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { color: #a0a0a0; font-size: 14px; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>

        window.onload = async () => {
            await loadProfile(); // Загружаем профиль, определяем язык и применяем его
            await loadAppConfig(); // Загружаем баннеры и ссылки с учетом языка
        };

        function applyLanguage() {
            const t = i18n_app[currentLang];
            document.documentElement.lang = currentLang;
            
            document.getElementById('pageTitle').innerText = t.page_title;
            document.getElementById('formTitle').innerText = editingChildId ? t.form_title_edit : t.form_title_add;
            document.getElementById('labelLang').innerText = t.label_lang;
            document.getElementById('labelName').innerText = t.label_name;
            document.getElementById('childName').placeholder = t.placeholder_name;
            document.getElementById('labelGender').innerText = t.label_gender;
            document.getElementById('txtBoy').innerText = t.btn_boy;
            document.getElementById('txtGirl').innerText = t.btn_girl;
            document.getElementById('saveBtn').innerText = editingChildId ? t.btn_save_edit : t.btn_save_add;
            document.getElementById('cancelBtn').innerText = t.btn_cancel;
        }

        async function loadAppConfig() {
            try {
                const { data: banners } = await _supabase.from('banners').select('*').eq('is_active', true).order('sort_order', { ascending: true });
                if (banners && banners.length > 0) {
                    const track = document.getElementById('sliderTrack');
                    document.getElementById('sliderContainer').style.display = 'block';
                    track.innerHTML = banners.map(b => `
                        <div class="slide" style="background-image: url('${b.image_url}');"><div class="slide-title">${b.title}</div></div>
                    `).join('');
                    if (banners.length > 1) {
                        let currentSlide = 0;
                        sliderInterval = setInterval(() => {
                            currentSlide = (currentSlide + 1) % banners.length;
                            track.style.transform = `translateX(-${currentSlide * 100}%)`;
                        }, 5000);
                    }
                }

                const { data: settings } = await _supabase.from('app_settings').select('*');
                if (settings) {
                    settings.forEach(s => configUrls[s.key] = s.value);
                }

                const t = i18n_app[currentLang];
                document.getElementById('footerLinks').innerHTML = `
                    <a href="#" onclick="openLink('${configUrls.privacy_url}')">${t.footer_privacy}</a>
                    <a href="#" onclick="openLink('${configUrls.offer_url}')">${t.footer_offer}</a>
                    <a href="#" onclick="openLink('${configUrls.about_url}')">${t.footer_about}</a>
                `;

                const consentHtml = t.consent_text.replace('{offer}', configUrls.offer_url).replace('{privacy}', configUrls.privacy_url);
                document.getElementById('paymentConsentLabel').innerHTML = consentHtml;
                document.getElementById('regConsentLabel').innerHTML = consentHtml;

            } catch (e) { console.error("Ошибка загрузки конфига:", e); }
        }

        function selectGender(gender) {
            selectedGender = gender;
            document.getElementById('btn-M').classList.remove('selected');
            document.getElementById('btn-F').classList.remove('selected');
            document.getElementById(`btn-${gender}`).classList.add('selected');
        }

        async function loadProfile() {
            try {
                const { data: user, error: userError } = await _supabase.from('users').select('*').eq('telegram_id', telegramId).maybeSingle(); 
                if (userError) throw userError;
                
                userExists = !!user;
                if (userExists && user.bot_language) {
                    currentLang = user.bot_language;
                }
                
                applyLanguage(); // Применяем язык сразу после загрузки юзера
                updateStatusUI(user);

                const { data: children, error: childrenError } = await _supabase.from('children').select('*').eq('parent_telegram_id', telegramId).order('created_at', { ascending: true });
                if (childrenError) throw childrenError;

                allChildren = children || [];
                renderChildren(allChildren);
                checkLimitAndMode();

            } catch (err) {
                console.error("Ошибка загрузки:", err);
                document.getElementById('childrenList').innerHTML = '<p style="color: #ef4444; font-size: 14px;">Ошибка загрузки данных / Xatolik / Loading error.</p>';
            }
        }

        function updateStatusUI(user) {
            const section = document.getElementById('statusSection');
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');
            const renewBtn = document.getElementById('renewBtn');
            const paymentConsent = document.getElementById('paymentConsentContainer');
            const t = i18n_app[currentLang];
            
            section.style.display = 'block';

            if (!user) {
                section.style.display = 'none';
                return;
            }

            const now = new Date();
            const trialEnd = new Date(user.trial_end_date);
            const subEnd = user.subscription_end_date ? new Date(user.subscription_end_date) : null;
            
            const locale = currentLang === 'ru' ? 'ru-RU' : (currentLang === 'uz' ? 'uz-UZ' : 'en-US');
            const options = { day: 'numeric', month: 'long' };

            if (user.subscription_status === 'active' && subEnd && subEnd > now) {
                badge.className = 'status-badge active';
                badge.innerText = t.status_active;
                text.innerText = t.status_active_text.replace('{date}', subEnd.toLocaleDateString(locale, options));
                
                const diffDays = Math.ceil((subEnd - now) / (1000 * 60 * 60 * 24));
                if (diffDays <= 3) {
                    renewBtn.style.display = 'block';
                    renewBtn.innerText = t.btn_renew_active;
                    paymentConsent.style.display = 'flex';
                } else {
                    renewBtn.style.display = 'none';
                    paymentConsent.style.display = 'none';
                }
            } else if (user.subscription_status === 'trial' && trialEnd > now) {
                badge.className = 'status-badge trial';
                badge.innerText = t.status_trial;
                text.innerText = t.status_trial_text.replace('{date}', trialEnd.toLocaleDateString(locale, options));
                renewBtn.style.display = 'block';
                renewBtn.innerText = t.btn_renew_trial;
                paymentConsent.style.display = 'flex';
            } else {
                badge.className = 'status-badge inactive';
                badge.innerText = t.status_inactive;
                text.innerText = t.status_inactive_text;
                renewBtn.style.display = 'block';
                renewBtn.innerText = t.btn_renew_inactive;
                paymentConsent.style.display = 'flex';
            }
        }

        function initiatePayment() {
            const t = i18n_app[currentLang];
            const consent = document.getElementById('paymentConsent').checked;
            if (!consent) {
                tg.showAlert(t.alert_consent);
                return;
            }

            const merchantId = '371317599:TEST:1788436285141'; 
            const amount = 2450000; 
            const orderId = telegramId; 

            const params = `m=${merchantId};ac.order_id=${orderId};a=${amount}`;
            const encodedParams = btoa(params);
            const checkoutUrl = `https://checkout.paycom.uz/${encodedParams}`;

            const now = new Date();
            const tashkentTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Tashkent"}));
            const hours = tashkentTime.getHours();
            const minutes = tashkentTime.getMinutes();
            const isLate = hours > 19 || (hours === 19 && minutes >= 55);

            if (isLate) {
                tg.showAlert(t.alert_late, () => { tg.openLink(checkoutUrl); });
            } else {
                tg.openLink(checkoutUrl);
            }
        }

        function renderChildren(children) {
            const container = document.getElementById('childrenList');
            const t = i18n_app[currentLang];

            if (children.length === 0) {
                container.innerHTML = `<p style="color: #a0a0a0; font-size: 14px;">${t.no_profiles}</p>`;
                return;
            }

            container.innerHTML = children.map(child => {
                const genderIcon = child.gender === 'M' ? '👦' : '👧';
                const langFlag = child.language === 'ru' ? '🇷🇺' : (child.language === 'uz' ? '🇺🇿' : '🇬🇧');
                return `
                    <div class="child-card">
                        <div class="child-info">
                            <span class="child-name">${child.name} ${genderIcon}</span>
                            <span class="child-details">${t.label_lang}: ${langFlag}</span>
                        </div>
                        <div class="card-actions">
                            <button class="icon-btn" onclick="startEdit('${child.id}')">✏️</button>
                            <button class="icon-btn" onclick="deleteChild('${child.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function checkLimitAndMode() {
            const formContainer = document.getElementById('formContainer');
            const regConsent = document.getElementById('regConsentContainer');
            formContainer.style.display = 'block';
            
            if (!userExists && !editingChildId) regConsent.style.display = 'flex';
            else regConsent.style.display = 'none';

            if (allChildren.length >= 5 && !editingChildId) formContainer.style.display = 'none'; 
        }

        function startEdit(id) {
            const child = allChildren.find(c => c.id === id);
            if (!child) return;

            editingChildId = child.id;
            document.getElementById('childName').value = child.name;
            document.getElementById('language').value = child.language;
            selectGender(child.gender);
            
            applyLanguage();
            checkLimitAndMode();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function resetForm() {
            editingChildId = null;
            document.getElementById('childName').value = '';
            document.getElementById('language').value = 'ru';
            selectGender('M');
            
            applyLanguage();
            checkLimitAndMode();
        }

        async function deleteChild(id) {
            const t = i18n_app[currentLang];
            if (!confirm(t.alert_delete_confirm)) return;
            try {
                const { error } = await _supabase.from('children').delete().eq('id', id);
                if (error) throw error;
                await loadProfile();
            } catch (err) {
                console.error(err);
                tg.showAlert(t.alert_delete_err);
            }
        }

        async function saveData() {
            const btn = document.getElementById('saveBtn');
            const childName = document.getElementById('childName').value.trim();
            const language = document.getElementById('language').value;
            const t = i18n_app[currentLang];

            if (!childName) {
                tg.showAlert(t.alert_name);
                return;
            }

            if (!userExists && !editingChildId) {
                const consent = document.getElementById('regConsent').checked;
                if (!consent) {
                    tg.showAlert(t.alert_reg_consent);
                    return;
                }
            }

            btn.disabled = true;
            btn.innerText = t.btn_saving;

            try {
                if (editingChildId) {
                    const { error } = await _supabase.from('children').update({ name: childName, gender: selectedGender, language: language }).eq('id', editingChildId);
                    if (error) throw error;
                } else {
                    if (!userExists) {
                        const trialEndDate = new Date();
                        trialEndDate.setDate(trialEndDate.getDate() + 7);
                        await _supabase.from('users').insert({ 
                            telegram_id: telegramId, 
                            subscription_status: 'trial',
                            trial_end_date: trialEndDate.toISOString(),
                            bot_language: currentLang
                        });
                        userExists = true;
                    }

                    const { error } = await _supabase.from('children').insert({
                        parent_telegram_id: telegramId, name: childName, gender: selectedGender, language: language
                    });
                    if (error) throw error;

                    const now = new Date();
                    const tashkentTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Tashkent"}));
                    const hours = tashkentTime.getHours();
                    const minutes = tashkentTime.getMinutes();
                    const isLate = hours > 19 || (hours === 19 && minutes >= 55);

                    if (isLate) tg.showAlert(t.alert_added_late);
                    else tg.showAlert(t.alert_added);
                }

                resetForm();
                await loadProfile();
            } catch (error) {
                console.error(error);
                tg.showAlert(t.alert_save_err);
            } finally {
                btn.disabled = false;
                applyLanguage(); // Вернет правильный текст на кнопку
            }
        }
    </script>
</body>
</html>
