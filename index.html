<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление профилем</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        h1, h2 { font-weight: 600; margin-top: 0; }
        h1 { font-size: 22px; margin-bottom: 16px; margin-top: 16px; }
        h2 { font-size: 18px; margin-bottom: 16px; color: #10B981; }
        
        /* 1. СЛАЙДЕР СКАЗОК */
        .slider-container {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
            background-color: #1e1e1e;
        }
        .slider-track {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        .slide {
            min-width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
        }
        .slide-title {
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: white;
            width: 100%;
            padding: 20px 16px 12px 16px;
            font-weight: 600;
            font-size: 15px;
        }

        /* 2. КАРТОЧКА СТАТУСА ПОДПИСКИ */
        .status-card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 20px 16px;
            margin-top: 24px;
            margin-bottom: 0px;
            text-align: center;
            display: none; /* Скрыто до загрузки */
        }
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-badge.trial { background: rgba(245, 158, 11, 0.15); color: #F59E0B; }
        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: #10B981; }
        .status-badge.inactive { background: rgba(239, 68, 68, 0.15); color: #EF4444; }
        
        .status-text { font-size: 14px; color: #a0a0a0; margin-bottom: 20px; line-height: 1.4; }

        /* Карточки детей */
        .child-card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .child-info { display: flex; flex-direction: column; gap: 4px; }
        .child-name { font-size: 16px; font-weight: 600; }
        .child-details { font-size: 13px; color: #a0a0a0; }
        .card-actions { display: flex; gap: 8px; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 6px; border-radius: 8px; background-color: #2a2a2a; }
        
        /* Форма */
        #formContainer { margin-top: 24px; border-top: 1px solid #333; padding-top: 24px; }
        label { display: block; font-size: 14px; color: #a0a0a0; margin-bottom: 8px; }
        input[type="text"], select {
            background-color: #1e1e1e; color: #ffffff; border: 1px solid #333333; padding: 14px; border-radius: 12px;
            width: 100%; box-sizing: border-box; margin-bottom: 20px; font-size: 16px; outline: none;
        }
        input[type="text"]:focus, select:focus { border-color: #10B981; }
        
        .radio-group { display: flex; gap: 12px; margin-bottom: 24px; }
        .radio-label {
            flex: 1; background-color: #1e1e1e; border: 1px solid #333333; border-radius: 12px; padding: 14px; text-align: center; cursor: pointer;
        }
        .radio-label.selected { background-color: rgba(16, 185, 129, 0.1); border-color: #10B981; color: #10B981; }
        
        button.primary-btn {
            background-color: #10B981; color: #ffffff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%;
        }
        button:disabled { background-color: #333333; color: #888888; }
        .cancel-edit { background: none; border: none; color: #a0a0a0; width: 100%; margin-top: 12px; font-size: 14px; display: none; }
        
        /* Юридические чекбоксы */
        .legal-check {
            display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; text-align: left;
        }
        .legal-check input[type="checkbox"] { margin-top: 4px; accent-color: #10B981; width: 18px; height: 18px; }
        .legal-check label { font-size: 12px; color: #a0a0a0; line-height: 1.4; margin: 0; }
        .legal-check a { color: #10B981; text-decoration: none; }

        /* Подвал */
        .footer-links {
            margin-top: 32px; border-top: 1px solid #333; padding-top: 24px; padding-bottom: 40px; text-align: center; display: flex; flex-direction: column; gap: 16px;
        }
        .footer-links a { color: #888888; text-decoration: none; font-size: 13px; }
        .footer-links a:hover { color: #ffffff; }

        /* Анимация загрузки */
        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(16, 185, 129, 0.15); border-top: 4px solid #10B981; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { color: #a0a0a0; font-size: 14px; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

    <!-- СЛАЙДЕР СКАЗОК -->
    <div class="slider-container">
        <div class="slider-track" id="sliderTrack">
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1519074069444-1ba4fff66d16?w=600&h=300&fit=crop');">
                <div class="slide-title">Тайна космического кристалла</div>
            </div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1531259683007-016a7b628fc3?w=600&h=300&fit=crop');">
                <div class="slide-title">Волшебный лес чудес</div>
            </div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&h=300&fit=crop');">
                <div class="slide-title">Легенда старого замка</div>
            </div>
        </div>
    </div>

    <h1>Профили детей</h1>

    <div id="childrenList">
        <div class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text">Загружаем волшебство...</div>
        </div>
    </div>

    <div id="formContainer" style="display: none;">
        <h2 id="formTitle">Добавить ребенка</h2>
        
        <label for="language">Язык сказок</label>
        <select id="language">
            <option value="ru">🇷🇺 Русский</option>
            <option value="uz">🇺🇿 O'zbekcha</option>
            <option value="en">🇬🇧 English</option>
        </select>

        <label for="childName">Имя</label>
        <input type="text" id="childName" placeholder="Например: Тимур" autocomplete="off">

        <label>Пол</label>
        <div class="radio-group">
            <div class="radio-label selected" id="btn-M" onclick="selectGender('M')">Мальчик 👦</div>
            <div class="radio-label" id="btn-F" onclick="selectGender('F')">Девочка 👧</div>
        </div>

        <!-- Чекбокс при первичной регистрации -->
        <div id="regConsentContainer" class="legal-check" style="display: none;">
            <input type="checkbox" id="regConsent">
            <label for="regConsent">Я принимаю условия <a href="#" onclick="openLink('https://telegra.ph/Public-Offer')">Публичной оферты</a> и <a href="#" onclick="openLink('https://telegra.ph/Privacy')">Политики конфиденциальности</a></label>
        </div>

        <button class="primary-btn" id="saveBtn" onclick="saveData()">Добавить профиль</button>
        <button class="cancel-edit" id="cancelBtn" onclick="resetForm()">Отменить редактирование</button>
    </div>

    <!-- КАРТОЧКА СТАТУСА ПОДПИСКИ (ТЕПЕРЬ СНИЗУ) -->
    <div id="statusSection" class="status-card">
        <div id="statusBadge" class="status-badge">Загрузка...</div>
        <div id="statusText" class="status-text"></div>
        
        <div id="paymentConsentContainer" class="legal-check" style="display: none;">
            <input type="checkbox" id="paymentConsent">
            <label for="paymentConsent">Я принимаю условия <a href="#" onclick="openLink('https://telegra.ph/Public-Offer')">Публичной оферты</a> и <a href="#" onclick="openLink('https://telegra.ph/Privacy')">Политики конфиденциальности</a></label>
        </div>
        
        <button id="renewBtn" class="primary-btn" style="display: none;" onclick="initiatePayment()">Оплатить подписку (24 500 сум)</button>
    </div>

    <!-- ПОДВАЛ С ДОКУМЕНТАМИ -->
    <div class="footer-links">
        <a href="#" onclick="openLink('https://telegra.ph/Privacy')">Политика конфиденциальности</a>
        <a href="#" onclick="openLink('https://telegra.ph/Public-Offer')">Публичная оферта</a>
        <a href="#" onclick="openLink('https://telegra.ph/About')">О проекте</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Открытие ссылок (заглушка на Telegraph)
        function openLink(url) {
            tg.openLink(url);
        }

        // Логика слайдера
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const track = document.getElementById('sliderTrack');
        setInterval(() => {
            currentSlide = (currentSlide + 1) % slides.length;
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
        }, 5000);

        const supabaseUrl = 'https://lmxacoleuvsbtgxbhokc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxteGFjb2xldXZzYnRneGJob2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTg0OTEsImV4cCI6MjEwMjY5NDQ5MX0.Cy2H1qvhuX6lKSFFtrPeecmFr526WDddyakk5vIvqnc';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const telegramId = tg.initDataUnsafe?.user?.id || 123456789;
        let selectedGender = 'M';
        let editingChildId = null;
        let allChildren = [];
        let userExists = false;

        window.onload = loadProfile;

        function selectGender(gender) {
            selectedGender = gender;
            document.getElementById('btn-M').classList.remove('selected');
            document.getElementById('btn-F').classList.remove('selected');
            document.getElementById(`btn-${gender}`).classList.add('selected');
        }

        async function loadProfile() {
            try {
                const { data: user, error: userError } = await _supabase
                    .from('users')
                    .select('*')
                    .eq('telegram_id', telegramId)
                    .maybeSingle(); 

                if (userError) throw userError;
                
                userExists = !!user;
                updateStatusUI(user);

                const { data: children, error: childrenError } = await _supabase
                    .from('children')
                    .select('*')
                    .eq('parent_telegram_id', telegramId)
                    .order('created_at', { ascending: true });

                if (childrenError) throw childrenError;

                allChildren = children || [];
                renderChildren(allChildren);
                checkLimitAndMode();

            } catch (err) {
                console.error("Ошибка загрузки:", err);
                document.getElementById('childrenList').innerHTML = '<p style="color: #ef4444; font-size: 14px;">Ошибка загрузки данных.</p>';
            }
        }

        function updateStatusUI(user) {
            const section = document.getElementById('statusSection');
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');
            const renewBtn = document.getElementById('renewBtn');
            const paymentConsent = document.getElementById('paymentConsentContainer');
            
            section.style.display = 'block';

            if (!user) {
                section.style.display = 'none'; // Скрываем блок подписки для совсем новых пользователей
                return;
            }

            const now = new Date();
            const trialEnd = new Date(user.trial_end_date);
            const subEnd = user.subscription_end_date ? new Date(user.subscription_end_date) : null;
            
            const options = { day: 'numeric', month: 'long' };

            if (user.subscription_status === 'active' && subEnd && subEnd > now) {
                badge.className = 'status-badge active';
                badge.innerText = '✅ Активная подписка';
                text.innerText = `Доступ открыт до ${subEnd.toLocaleDateString('ru-RU', options)}. Сказки приходят каждый день!`;
                
                // Вычисляем, сколько дней осталось до конца подписки
                const diffDays = Math.ceil((subEnd - now) / (1000 * 60 * 60 * 24));
                
                // Если осталось 3 дня или меньше - показываем кнопку продления
                if (diffDays <= 3) {
                    renewBtn.style.display = 'block';
                    renewBtn.innerText = 'Продлить на месяц (24 500 сум)';
                    paymentConsent.style.display = 'flex';
                } else {
                    renewBtn.style.display = 'none';
                    paymentConsent.style.display = 'none';
                }

            } else if (user.subscription_status === 'trial' && trialEnd > now) {
                badge.className = 'status-badge trial';
                badge.innerText = '⏳ Пробный период';
                text.innerText = `Бесплатный доступ до ${trialEnd.toLocaleDateString('ru-RU', options)}. Оформите подписку заранее, чтобы сказки не прерывались.`;
                renewBtn.style.display = 'block';
                renewBtn.innerText = 'Оформить подписку (24 500 сум)';
                paymentConsent.style.display = 'flex';
            } else {
                badge.className = 'status-badge inactive';
                badge.innerText = '❌ Неактивная';
                text.innerText = 'Волшебное время истекло. Продлите доступ, чтобы дети снова получали уникальные сказки.';
                renewBtn.style.display = 'block';
                renewBtn.innerText = 'Возобновить подписку (24 500 сум)';
                paymentConsent.style.display = 'flex';
            }
        }

        function initiatePayment() {
            const consent = document.getElementById('paymentConsent').checked;
            if (!consent) {
                tg.showAlert("Пожалуйста, подтвердите согласие с Офертой и Политикой конфиденциальности.");
                return;
            }

            const merchantId = '67fc349fca95ffea6667f140'; 
            const amount = 2450000; 
            const orderId = telegramId; 

            const params = `m=${merchantId};ac.order_id=${orderId};a=${amount}`;
            const encodedParams = btoa(params);
            const checkoutUrl = `https://checkout.paycom.uz/${encodedParams}`;

            const now = new Date();
            const tashkentTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Tashkent"}));
            const hours = tashkentTime.getHours();
            const minutes = tashkentTime.getMinutes();
            const isLate = hours > 19 || (hours === 19 && minutes >= 55);

            if (isLate) {
                tg.showAlert("Обратите внимание: при оплате сейчас, следующая сказка придет завтра в 21:00.", () => {
                    tg.openLink(checkoutUrl); 
                });
            } else {
                tg.openLink(checkoutUrl);
            }
        }

        function renderChildren(children) {
            const container = document.getElementById('childrenList');
            if (children.length === 0) {
                container.innerHTML = '<p style="color: #a0a0a0; font-size: 14px;">Профили еще не добавлены.</p>';
                return;
            }

            container.innerHTML = children.map(child => {
                const genderIcon = child.gender === 'M' ? '👦' : '👧';
                const langFlag = child.language === 'ru' ? '🇷🇺' : (child.language === 'uz' ? '🇺🇿' : '🇬🇧');
                
                return `
                    <div class="child-card">
                        <div class="child-info">
                            <span class="child-name">${child.name} ${genderIcon}</span>
                            <span class="child-details">Язык: ${langFlag}</span>
                        </div>
                        <div class="card-actions">
                            <button class="icon-btn" onclick="startEdit('${child.id}')" title="Редактировать">✏️</button>
                            <button class="icon-btn" onclick="deleteChild('${child.id}')" title="Удалить">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function checkLimitAndMode() {
            const formContainer = document.getElementById('formContainer');
            const regConsent = document.getElementById('regConsentContainer');
            
            formContainer.style.display = 'block';
            
            if (!userExists && !editingChildId) {
                regConsent.style.display = 'flex';
            } else {
                regConsent.style.display = 'none';
            }

            if (allChildren.length >= 5 && !editingChildId) {
                formContainer.style.display = 'none'; 
            }
        }

        function startEdit(id) {
            const child = allChildren.find(c => c.id === id);
            if (!child) return;

            editingChildId = child.id;
            document.getElementById('childName').value = child.name;
            document.getElementById('language').value = child.language;
            selectGender(child.gender);

            document.getElementById('formTitle').innerText = 'Редактировать профиль';
            document.getElementById('saveBtn').innerText = 'Сохранить изменения';
            document.getElementById('cancelBtn').style.display = 'block';
            
            checkLimitAndMode();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function resetForm() {
            editingChildId = null;
            document.getElementById('childName').value = '';
            document.getElementById('language').value = 'ru';
            selectGender('M');

            document.getElementById('formTitle').innerText = 'Добавить ребенка';
            document.getElementById('saveBtn').innerText = 'Добавить профиль';
            document.getElementById('cancelBtn').style.display = 'none';

            checkLimitAndMode();
        }

        async function deleteChild(id) {
            if (!confirm("Вы уверены, что хотите удалить этот профиль?")) return;
            try {
                const { error } = await _supabase.from('children').delete().eq('id', id);
                if (error) throw error;
                await loadProfile();
            } catch (err) {
                console.error(err);
                tg.showAlert("Не удалось удалить профиль.");
            }
        }

        async function saveData() {
            const btn = document.getElementById('saveBtn');
            const childName = document.getElementById('childName').value.trim();
            const language = document.getElementById('language').value;

            if (!childName) {
                tg.showAlert("Пожалуйста, введите имя ребенка");
                return;
            }

            if (!userExists && !editingChildId) {
                const consent = document.getElementById('regConsent').checked;
                if (!consent) {
                    tg.showAlert("Для продолжения необходимо принять условия Оферты и Политики конфиденциальности.");
                    return;
                }
            }

            btn.disabled = true;
            btn.innerText = "Сохранение...";

            try {
                if (editingChildId) {
                    const { error } = await _supabase.from('children').update({ name: childName, gender: selectedGender, language: language }).eq('id', editingChildId);
                    if (error) throw error;
                } else {
                    if (!userExists) {
                        const trialEndDate = new Date();
                        trialEndDate.setDate(trialEndDate.getDate() + 7);
                        await _supabase.from('users').insert({ 
                            telegram_id: telegramId, 
                            subscription_status: 'trial',
                            trial_end_date: trialEndDate.toISOString()
                        });
                        userExists = true;
                    }

                    const { error } = await _supabase.from('children').insert({
                        parent_telegram_id: telegramId,
                        name: childName,
                        gender: selectedGender,
                        language: language
                    });
                    if (error) throw error;

                    const now = new Date();
                    const tashkentTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Tashkent"}));
                    const hours = tashkentTime.getHours();
                    const minutes = tashkentTime.getMinutes();
                    const isLate = hours > 19 || (hours === 19 && minutes >= 55);

                    if (isLate) {
                        tg.showAlert("Профиль добавлен! ✨\n\nТак как уже вечер, первая сказка придет завтра в 21:00.");
                    } else {
                        tg.showAlert("Профиль успешно добавлен!");
                    }
                }

                resetForm();
                await loadProfile();
                
            } catch (error) {
                console.error(error);
                tg.showAlert("Произошла ошибка при сохранении.");
            } finally {
                btn.disabled = false;
                btn.innerText = editingChildId ? "Сохранить изменения" : "Добавить профиль";
            }
        }
    </script>
</body>
</html>
