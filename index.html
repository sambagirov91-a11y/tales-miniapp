<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой профиль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        h1, h2 {
            font-weight: 600;
            margin-top: 0;
        }
        h1 { font-size: 24px; margin-bottom: 24px; }
        h2 { font-size: 18px; margin-bottom: 16px; color: #10B981; }
        
        /* Список детей */
        .child-card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .child-info { display: flex; flex-direction: column; gap: 4px; }
        .child-name { font-size: 16px; font-weight: 600; }
        .child-details { font-size: 13px; color: #a0a0a0; }
        
        /* Форма добавления */
        #addFormContainer { margin-top: 24px; border-top: 1px solid #333; padding-top: 24px; }
        label { display: block; font-size: 14px; color: #a0a0a0; margin-bottom: 8px; }
        input[type="text"], select {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus { border-color: #10B981; }
        
        .radio-group { display: flex; gap: 12px; margin-bottom: 24px; }
        .radio-label {
            flex: 1;
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .radio-label.selected {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: #10B981;
            color: #10B981;
        }
        
        button {
            background-color: #10B981;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:disabled { background-color: #333333; color: #888888; }
        .limit-msg { color: #ef4444; font-size: 14px; text-align: center; margin-top: 16px; display: none; }
    </style>
</head>
<body>

    <h1>Мой профиль</h1>

    <!-- Блок со списком детей -->
    <div id="childrenList">
        <p style="color: #a0a0a0; font-size: 14px;">Загрузка профилей...</p>
    </div>

    <!-- Блок добавления нового ребенка -->
    <div id="addFormContainer" style="display: none;">
        <h2>Добавить ребенка</h2>
        
        <label for="language">Язык сказок</label>
        <select id="language">
            <option value="ru">🇷🇺 Русский</option>
            <option value="uz">🇺🇿 O'zbekcha</option>
            <option value="en">🇬🇧 English</option>
        </select>

        <label for="childName">Имя</label>
        <input type="text" id="childName" placeholder="Например: Тимур" autocomplete="off">

        <label>Пол</label>
        <div class="radio-group">
            <div class="radio-label selected" id="btn-M" onclick="selectGender('M')">Мальчик 👦</div>
            <div class="radio-label" id="btn-F" onclick="selectGender('F')">Девочка 👧</div>
        </div>

        <button id="saveBtn" onclick="saveData()">Добавить профиль</button>
    </div>
    
    <div id="limitMsg" class="limit-msg">
        Достигнут лимит (максимум 5 детей на один аккаунт).
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Инициализация Supabase (ВСТАВЬ СВОИ КЛЮЧИ СЮДА)
        const supabaseUrl = 'https://lmxacoleuvsbtgxbhokc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxteGFjb2xldXZzYnRneGJob2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTg0OTEsImV4cCI6MjEwMjY5NDQ5MX0.Cy2H1qvhuX6lKSFFtrPeecmFr526WDddyakk5vIvqnc';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const telegramId = tg.initDataUnsafe?.user?.id || 123456789; // Заглушка для теста в браузере
        let selectedGender = 'M';

        // Загрузка данных при старте
        window.onload = loadProfile;

        function selectGender(gender) {
            selectedGender = gender;
            document.getElementById('btn-M').classList.remove('selected');
            document.getElementById('btn-F').classList.remove('selected');
            document.getElementById(`btn-${gender}`).classList.add('selected');
        }

        async function loadProfile() {
            try {
                // Получаем всех детей этого родителя
                const { data: children, error } = await _supabase
                    .from('children')
                    .select('*')
                    .eq('parent_telegram_id', telegramId)
                    .order('created_at', { ascending: true });

                if (error) throw error;

                renderChildren(children || []);
                checkLimit(children ? children.length : 0);

            } catch (err) {
                console.error("Ошибка загрузки:", err);
                document.getElementById('childrenList').innerHTML = '<p style="color: red;">Ошибка загрузки данных.</p>';
            }
        }

        function renderChildren(children) {
            const container = document.getElementById('childrenList');
            if (children.length === 0) {
                container.innerHTML = '<p style="color: #a0a0a0; font-size: 14px;">У вас пока нет добавленных детей.</p>';
                return;
            }

            container.innerHTML = children.map(child => {
                const genderIcon = child.gender === 'M' ? '👦' : '👧';
                const langFlag = child.language === 'ru' ? '🇷🇺' : (child.language === 'uz' ? '🇺🇿' : '🇬🇧');
                
                return `
                    <div class="child-card">
                        <div class="child-info">
                            <span class="child-name">${child.name} ${genderIcon}</span>
                            <span class="child-details">Язык: ${langFlag}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function checkLimit(count) {
            const form = document.getElementById('addFormContainer');
            const limitMsg = document.getElementById('limitMsg');
            
            if (count >= 5) {
                form.style.display = 'none';
                limitMsg.style.display = 'block';
            } else {
                form.style.display = 'block';
                limitMsg.style.display = 'none';
            }
        }

        async function saveData() {
            const btn = document.getElementById('saveBtn');
            const childName = document.getElementById('childName').value.trim();
            const language = document.getElementById('language').value;

            if (!childName) {
                tg.showAlert("Пожалуйста, введите имя ребенка");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Сохранение...";

            try {
                // Проверяем, есть ли уже этот юзер (для создания триала, если это первый ребенок)
                const { data: user } = await _supabase.from('users').select('telegram_id').eq('telegram_id', telegramId).single();
                
                if (!user) {
                    const trialEndDate = new Date();
                    trialEndDate.setDate(trialEndDate.getDate() + 7);
                    await _supabase.from('users').insert({ 
                        telegram_id: telegramId, 
                        subscription_status: 'trial',
                        trial_end_date: trialEndDate.toISOString()
                    });
                }

                // Добавляем ребенка
                const { error: childError } = await _supabase.from('children').insert({
                    parent_telegram_id: telegramId,
                    name: childName,
                    gender: selectedGender,
                    language: language
                });
                if (childError) throw childError;

                // Очищаем форму и перезагружаем список
                document.getElementById('childName').value = '';
                tg.showAlert("Профиль успешно добавлен!");
                await loadProfile(); // Обновляем экран
                
            } catch (error) {
                console.error(error);
                tg.showAlert("Произошла ошибка при сохранении.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Добавить профиль";
            }
        }
    </script>
</body>
</html>
