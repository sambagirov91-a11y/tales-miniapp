<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление профилем</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        h1, h2 {
            font-weight: 600;
            margin-top: 0;
        }
        h1 { font-size: 24px; margin-bottom: 24px; }
        h2 { font-size: 18px; margin-bottom: 16px; color: #10B981; }
        
        .child-card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .child-info { display: flex; flex-direction: column; gap: 4px; }
        .child-name { font-size: 16px; font-weight: 600; }
        .child-details { font-size: 13px; color: #a0a0a0; }
        
        .card-actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
            border-radius: 8px;
            background-color: #2a2a2a;
            transition: background-color 0.2s;
        }
        .icon-btn:hover { background-color: #333333; }

        #formContainer { margin-top: 24px; border-top: 1px solid #333; padding-top: 24px; }
        label { display: block; font-size: 14px; color: #a0a0a0; margin-bottom: 8px; }
        input[type="text"], select {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus { border-color: #10B981; }
        
        .radio-group { display: flex; gap: 12px; margin-bottom: 24px; }
        .radio-label {
            flex: 1;
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .radio-label.selected {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: #10B981;
            color: #10B981;
        }
        
        button.primary-btn {
            background-color: #10B981;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:disabled { background-color: #333333; color: #888888; }
        
        .cancel-edit {
            background: none;
            border: none;
            color: #a0a0a0;
            text-align: center;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
            font-size: 14px;
            display: none;
        }
        .limit-msg { color: #ef4444; font-size: 14px; text-align: center; margin-top: 16px; display: none; }
    </style>
</head>
<body>

    <h1>Мой профиль</h1>

    <div id="childrenList">
        <p style="color: #a0a0a0; font-size: 14px;">Загрузка профилей...</p>
    </div>

    <div id="formContainer">
        <h2 id="formTitle">Добавить ребенка</h2>
        
        <label for="language">Язык сказок</label>
        <select id="language">
            <option value="ru">🇷🇺 Русский</option>
            <option value="uz">🇺🇿 O'zbekcha</option>
            <option value="en">🇬🇧 English</option>
        </select>

        <label for="childName">Имя</label>
        <input type="text" id="childName" placeholder="Например: Тимур" autocomplete="off">

        <label>Пол</label>
        <div class="radio-group">
            <div class="radio-label selected" id="btn-M" onclick="selectGender('M')">Мальчик 👦</div>
            <div class="radio-label" id="btn-F" onclick="selectGender('F')">Девочка 👧</div>
        </div>

        <button class="primary-btn" id="saveBtn" onclick="saveData()">Добавить профиль</button>
        <button class="cancel-edit" id="cancelBtn" onclick="resetForm()">Отменить редактирование</button>
    </div>
    
    <div id="limitMsg" class="limit-msg">
        Достигнут лимит (максимум 5 детей на один аккаунт).
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const supabaseUrl = 'https://lmxacoleuvsbtgxbhokc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxteGFjb2xldXZzYnRneGJob2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTg0OTEsImV4cCI6MjEwMjY5NDQ5MX0.Cy2H1qvhuX6lKSFFtrPeecmFr526WDddyakk5vIvqnc';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const telegramId = tg.initDataUnsafe?.user?.id || 123456789;
        let selectedGender = 'M';
        let editingChildId = null;
        let allChildren = [];

        window.onload = loadProfile;

        function selectGender(gender) {
            selectedGender = gender;
            document.getElementById('btn-M').classList.remove('selected');
            document.getElementById('btn-F').classList.remove('selected');
            document.getElementById(`btn-${gender}`).classList.add('selected');
        }

        async function loadProfile() {
            try {
                // Изменено: Используем maybeSingle() вместо single(). 
                // single() вызывает фатальную ошибку, если пользователь заходит впервые и его еще нет в таблице 'users'.
                const { data: user, error: userError } = await _supabase
                    .from('users')
                    .select('*')
                    .eq('telegram_id', telegramId)
                    .maybeSingle(); 

                if (userError) throw userError;

                if (user) {
                    const now = new Date();
                    const trialEnd = new Date(user.trial_end_date);
                    
                    if (user.subscription_status === 'trial' && now > trialEnd) {
                        showPaywall();
                        return; 
                    }
                }

                const { data: children, error: childrenError } = await _supabase
                    .from('children')
                    .select('*')
                    .eq('parent_telegram_id', telegramId)
                    .order('created_at', { ascending: true });

                if (childrenError) throw childrenError;

                allChildren = children || [];
                renderChildren(allChildren);
                checkLimitAndMode();

            } catch (err) {
                console.error("Ошибка загрузки:", err);
                document.getElementById('childrenList').innerHTML = '<p style="color: red;">Ошибка загрузки данных.</p>';
            }
        }

        function showPaywall() {
            document.body.innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <h1 style="font-size: 48px; margin-bottom: 16px;">✨</h1>
                    <h2>Волшебное время истекло</h2>
                    <p style="color: #a0a0a0; font-size: 15px; margin-bottom: 32px; line-height: 1.5;">
                        Ваш 7-дневный пробный период завершен. Оформите подписку, чтобы каждый вечер радовать детей новыми персонализированными сказками.
                    </p>
                    <button class="primary-btn" onclick="initiatePayment()">Оформить подписку</button>
                </div>
            `;
        }

        function initiatePayment() {
            const merchantId = '371317599:TEST:1788436285141'; 
            const amount = 5000000; 
            const orderId = telegramId; 

            const params = `m=${merchantId};ac.order_id=${orderId};a=${amount}`;
            const encodedParams = btoa(params);
            const checkoutUrl = `https://checkout.paycom.uz/${encodedParams}`;

            const now = new Date();
            const tashkentTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Tashkent"}));
            const hours = tashkentTime.getHours();
            const minutes = tashkentTime.getMinutes();
            const isLate = hours > 19 || (hours === 19 && minutes >= 55);

            if (isLate) {
                tg.showAlert("Обратите внимание: при оплате сейчас, следующая сказка придет завтра в 21:00.", () => {
                    tg.openLink(checkoutUrl); 
                });
            } else {
                tg.openLink(checkoutUrl);
            }
        }

        function renderChildren(children) {
            const container = document.getElementById('childrenList');
            if (children.length === 0) {
                container.innerHTML = '<p style="color: #a0a0a0; font-size: 14px;">У вас пока нет добавленных детей.</p>';
                return;
            }

            container.innerHTML = children.map(child => {
                const genderIcon = child.gender === 'M' ? '👦' : '👧';
                const langFlag = child.language === 'ru' ? '🇷🇺' : (child.language === 'uz' ? '🇺🇿' : '🇬🇧');
                
                return `
                    <div class="child-card">
                        <div class="child-info">
                            <span class="child-name">${child.name} ${genderIcon}</span>
                            <span class="child-details">Язык: ${langFlag}</span>
                        </div>
                        <div class="card-actions">
                            <button class="icon-btn" onclick="startEdit('${child.id}')" title="Редактировать">✏️</button>
                            <button class="icon-btn" onclick="deleteChild('${child.id}')" title="Удалить">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function checkLimitAndMode() {
            const formContainer = document.getElementById('formContainer');
            const limitMsg = document.getElementById('limitMsg');
            
            if (editingChildId) {
                formContainer.style.display = 'block';
                limitMsg.style.display = 'none';
                return;
            }

            if (allChildren.length >= 5) {
                formContainer.style.display = 'none';
                limitMsg.style.display = 'block';
            } else {
                formContainer.style.display = 'block';
                limitMsg.style.display = 'none';
            }
        }

        function startEdit(id) {
            const child = allChildren.find(c => c.id === id);
            if (!child) return;

            editingChildId = child.id;
            document.getElementById('childName').value = child.name;
            document.getElementById('language').value = child.language;
            selectGender(child.gender);

            document.getElementById('formTitle').innerText = 'Редактировать профиль';
            document.getElementById('saveBtn').innerText = 'Сохранить изменения';
            document.getElementById('cancelBtn').style.display = 'block';

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function resetForm() {
            editingChildId = null;
            document.getElementById('childName').value = '';
            document.getElementById('language').value = 'ru';
            selectGender('M');

            document.getElementById('formTitle').innerText = 'Добавить ребенка';
            document.getElementById('saveBtn').innerText = 'Добавить профиль';
            document.getElementById('cancelBtn').style.display = 'none';

            checkLimitAndMode();
        }

        async function deleteChild(id) {
            if (!confirm("Вы уверены, что хотите удалить этот профиль?")) return;

            try {
                const { error } = await _supabase.from('children').delete().eq('id', id);
                if (error) throw error;

                tg.showAlert("Профиль удален.");
                await loadProfile();
            } catch (err) {
                console.error(err);
                tg.showAlert("Не удалось удалить профиль.");
            }
        }

        async function saveData() {
            const btn = document.getElementById('saveBtn');
            const childName = document.getElementById('childName').value.trim();
            const language = document.getElementById('language').value;

            if (!childName) {
                tg.showAlert("Пожалуйста, введите имя ребенка");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Сохранение...";

            try {
                if (editingChildId) {
                    const { error } = await _supabase
                        .from('children')
                        .update({ name: childName, gender: selectedGender, language: language })
                        .eq('id', editingChildId);
                    if (error) throw error;
                    
                    tg.showAlert("Профиль успешно обновлен!");
                } else {
                    // Изменено: также используем maybeSingle() при проверке пользователя при создании профиля
                    const { data: user } = await _supabase.from('users').select('telegram_id').eq('telegram_id', telegramId).maybeSingle();
                    
                    if (!user) {
                        const trialEndDate = new Date();
                        trialEndDate.setDate(trialEndDate.getDate() + 7);
                        await _supabase.from('users').insert({ 
                            telegram_id: telegramId, 
                            subscription_status: 'trial',
                            trial_end_date: trialEndDate.toISOString()
                        });
                    }

                    const { error } = await _supabase.from('children').insert({
                        parent_telegram_id: telegramId,
                        name: childName,
                        gender: selectedGender,
                        language: language
                    });
                    if (error) throw error;

                    const now = new Date();
                    const tashkentTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Tashkent"}));
                    const hours = tashkentTime.getHours();
                    const minutes = tashkentTime.getMinutes();
                    
                    const isLate = hours > 19 || (hours === 19 && minutes >= 55);

                    if (isLate) {
                        tg.showAlert("Профиль добавлен! ✨\n\nТак как уже вечер, наш сервис подготовит вашу первую сказку на завтра. Ждите её ровно в 21:00!");
                    } else {
                        tg.showAlert("Профиль успешно добавлен!");
                    }
                }

                resetForm();
                await loadProfile();
                
            } catch (error) {
                console.error(error);
                tg.showAlert("Произошла ошибка при сохранении.");
            } finally {
                btn.disabled = false;
                btn.innerText = editingChildId ? "Сохранить изменения" : "Добавить профиль";
            }
        }
    </script>
</body>
</html>
