<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Настройка сказок</title>
    <!-- Скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Библиотека Supabase для фронтенда -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Минималистичный темный дизайн с изумрудными акцентами */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            font-weight: 600;
        }
        label {
            display: block;
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 8px;
        }
        input[type="text"], select {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #10B981;
        }
        .radio-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .radio-label {
            flex: 1;
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .radio-label.selected {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: #10B981;
            color: #10B981;
        }
        button {
            background-color: #10B981;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
        }
        button:disabled {
            background-color: #333333;
            color: #888888;
        }
    </style>
</head>
<body>

    <h1>Профиль ребенка</h1>

    <label for="language">Язык сказок</label>
    <select id="language">
        <option value="ru">🇷🇺 Русский</option>
        <option value="uz">🇺🇿 O'zbekcha</option>
        <option value="en">🇬🇧 English</option>
    </select>

    <label for="childName">Имя</label>
    <input type="text" id="childName" placeholder="Например: Тимур" autocomplete="off">

    <label>Пол</label>
    <div class="radio-group">
        <div class="radio-label selected" id="btn-M" onclick="selectGender('M')">Мальчик 👦</div>
        <div class="radio-label" id="btn-F" onclick="selectGender('F')">Девочка 👧</div>
    </div>

    <button id="saveBtn" onclick="saveData()">Сохранить профиль</button>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Инициализация Supabase (ВСТАВЬ СВОИ КЛЮЧИ СЮДА)
        const supabaseUrl = 'https://lmxacoleuvsbtgxbhokc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxteGFjb2xldXZzYnRneGJob2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTg0OTEsImV4cCI6MjEwMjY5NDQ5MX0.Cy2H1qvhuX6lKSFFtrPeecmFr526WDddyakk5vIvqnc';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let selectedGender = 'M'; // По умолчанию мальчик

        function selectGender(gender) {
            selectedGender = gender;
            document.getElementById('btn-M').classList.remove('selected');
            document.getElementById('btn-F').classList.remove('selected');
            document.getElementById(`btn-${gender}`).classList.add('selected');
        }

        async function saveData() {
            const btn = document.getElementById('saveBtn');
            const childName = document.getElementById('childName').value.trim();
            const language = document.getElementById('language').value;

            if (!childName) {
                tg.showAlert("Пожалуйста, введите имя ребенка");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Сохранение...";

            // Получаем ID пользователя из Telegram. 
            // Если открыто в браузере (не в ТГ), ставим заглушку для тестов.
            const telegramId = tg.initDataUnsafe?.user?.id || 123456789;

            try {
                // 1. Создаем пользователя (Триал на 7 дней)
                const trialEndDate = new Date();
                trialEndDate.setDate(trialEndDate.getDate() + 7);

                const { error: userError } = await _supabase.from('users').upsert({ 
                    telegram_id: telegramId, 
                    subscription_status: 'trial',
                    trial_end_date: trialEndDate.toISOString(),
                    timezone: 'Asia/Tashkent'
                });
                if (userError) throw userError;

                // 2. Сохраняем ребенка
                const { error: childError } = await _supabase.from('children').insert({
                    parent_telegram_id: telegramId,
                    name: childName,
                    gender: selectedGender,
                    language: language
                });
                if (childError) throw childError;

                tg.showAlert(`Отлично! Первая сказка для ${childName} придет сегодня в 21:00!`, () => {
                    tg.close(); // Закрываем Mini App
                });

            } catch (error) {
                console.error(error);
                tg.showAlert("Произошла ошибка при сохранении.");
                btn.disabled = false;
                btn.innerText = "Сохранить профиль";
            }
        }
    </script>
</body>
</html>
