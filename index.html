<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление профилем</title>
    <!-- Подключаем внешние скрипты -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Подключаем наш вынесенный файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider-container" id="sliderContainer">
        <div class="slider-track" id="sliderTrack"></div>
    </div>

    <!-- Обновленный заголовок с переключателем языка -->
    <div class="header-container">
        <h1 id="pageTitle">Профили детей</h1>
        <select id="appLangSelector" onchange="changeAppLanguage(this.value)">
            <option value="ru">🇷🇺 RU</option>
            <option value="uz">🇺🇿 UZ</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <div id="childrenList">
        <div class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderText">Загружаем...</div>
        </div>
    </div>

    <div id="formContainer" style="display: none;">
        <h2 id="formTitle">Добавить ребенка</h2>
        
        <label for="language" id="labelLang">Язык сказок</label>
        <select id="language">
            <option value="ru">🇷🇺 Русский</option>
            <option value="uz">🇺🇿 O'zbekcha</option>
            <option value="en">🇬🇧 English</option>
        </select>

        <label for="childName" id="labelName">Имя</label>
        <input type="text" id="childName" placeholder="Например: Тимур" autocomplete="off">

        <label id="labelGender">Пол</label>
        <div class="radio-group">
            <div class="radio-label selected" id="btn-M" onclick="selectGender('M')"><span id="txtBoy">Мальчик 👦</span></div>
            <div class="radio-label" id="btn-F" onclick="selectGender('F')"><span id="txtGirl">Девочка 👧</span></div>
        </div>

        <div id="regConsentContainer" class="legal-check" style="display: none;">
            <input type="checkbox" id="regConsent">
            <label for="regConsent" id="regConsentLabel"></label>
        </div>

        <button class="primary-btn" id="saveBtn" onclick="saveData()">Добавить профиль</button>
        <button class="cancel-edit" id="cancelBtn" onclick="resetForm()">Отменить редактирование</button>
    </div>

    <div id="statusSection" class="status-card">
        <div id="statusBadge" class="status-badge">...</div>
        <div id="statusText" class="status-text"></div>
        
        <div id="paymentConsentContainer" class="legal-check" style="display: none;">
            <input type="checkbox" id="paymentConsent">
            <label for="paymentConsent" id="paymentConsentLabel"></label>
        </div>
        
        <button id="renewBtn" class="primary-btn" style="display: none;" onclick="initiatePayment()"></button>
    </div>

    <div class="footer-links" id="footerLinks"></div>

    <!-- Подключаем нашу вынесенную логику -->
    <script src="app.js" defer></script>
</body>
</html>
